<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="position: relative; ">
    <div class="alert hide" style="position: absolute; left: 50%;top: 50%; transform: translate(-50%,-50%); width: 50%;display: flex; justify-content: center;align-items: center;z-index: 3;background-color: white;border-radius: 25px; height: 25%;">
        <p style="font-size: 35px; font-family: Arial, Helvetica, sans-serif; letter-spacing: 1.5px;">there is no item</p>
        <button class="close-alert" style="position: absolute;top: -7px;right: -7px; width: 30px; height: 30px; border-radius: 100%; background-color: red; color: white;">X</button>
    </div>
    <section class="price-check ">  


        <div class="input-field" style="margin-top: 50px;">
            <div>
                <div style="display: flex; gap: 10px; justify-content: center; align-items: center;">
                    <input type="text" id="product-code-input" placeholder="write product code" >
                    <button id="scan-btn" style="padding: 5px 10px; cursor: pointer;">📷 Scan</button>
                </div>

                <div id="scanner-wrapper" style="display: block; position: relative; margin: 15px auto; width: 250px; height: 200px; background: #000; border: 2px solid #333; border-radius: 8px; overflow: hidden; box-sizing: border-box;">
                    
                    <div id="scanner-view" style="width: 100%; height: 100%;"></div>
                    
                    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: none; z-index: 10;">
                        
                        <div style="width: 85%; height: 100px; border: 3px dashed #00ff66; border-radius: 6px; position: relative; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);">
                            
                            <div style="position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background-color: rgba(255, 0, 0, 0.7); box-shadow: 0 0 8px #ff0000;"></div>
                        </div>

                        <span style="margin-top: 10px; color: #00ff66; font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; white-space: nowrap; text-shadow: 2px 2px 4px #000; background: rgba(0,0,0,0.7); padding: 2px 8px; border-radius: 4px;">
                            Align Barcode Within Border
                        </span>
                    </div>
                </div>
                </div>
            <div class="numbers-field">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>0</button>

            </div>
            <div class="control-numbers">
                <button class="add-product">Enter</button>
                <button class="clear-input">Clear</button>
                <button class="delete-part-of-input">Delete</button> 
            </div>
            <div class="container" style="margin-top: 50px;margin-bottom: 50px;">
                <p class="product-name"> product name:</p>
                <p class="product-price">product price:</p>
                <p class="product-code">product code:</p>
            </div>                                      
        </div>
        <button class="add-item" style="position: absolute;">add Item</button>
    </section>
    <section class="table-section hide" >
        <table style="width: 95%; ">
            <thead>
            <th>item name</th>
            <th>item price</th>
            <th>item Quantity</th>
            <th>item code</th>
            </thead>
            <tbody>

            </tbody>
        </table>
        <button class="return-to-price-check" onclick="returnBack()">return to price check</button>
    </section>
    <script src="data-script.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="script.js"></script> 
</body>
</html>
