<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="position: relative; ">
    <div class="alert hide" style="position: absolute; left: 50%;top: 50%; transform: translate(-50%,-50%); width: 50%;display: flex; justify-content: center;align-items: center;z-index: 3;background-color: white;border-radius: 25px; height: 25%;">
        <p style="font-size: 35px; font-family: Arial, Helvetica, sans-serif; letter-spacing: 1.5px;">there is no item</p>
        <button class="close-alert" style="position: absolute;top: -7px;right: -7px; width: 30px; height: 30px; border-radius: 100%; background-color: red; color: white;">X</button>
    </div>
    <section class="price-check ">  


        <div class="input-field" style="margin-top: 50px;">
            <div>
                <div style="display: flex; gap: 10px; justify-content: center; align-items: center;">
                    <input type="text" id="product-code-input" placeholder="write product code">
                    <button id="scan-btn" style="padding: 5px 10px; cursor: pointer;">📷 Scan</button>
                </div>

                <!-- A hidden camera container that pops up when they click Scan -->
                <div id="scanner-modal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border: 2px solid #000; padding: 20px; z-index: 1000;">
                    <div id="scanner-view" style="width: 300px; height: 200px;"></div>
                    <button id="close-scanner-btn" style="margin-top: 10px; width: 100%;">Cancel</button>
                </div>
            </div>
            <div class="numbers-field">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>0</button>

            </div>
            <div class="control-numbers">
                <button class="add-product">>=|</button>
                <button class="clear-input">C</button>
                <button class="delete-part-of-input">X</button> 
            </div>
            <div class="container" style="margin-top: 50px;">
                <p class="product-name"> product name:</p>
                <p class="product-price">product price:</p>
                <p class="product-code">product code:</p>
            </div>                                      
        </div>
        <button class="add-item" style="position: absolute;">add Item</button>
    </section>
    <section class="table-section hide" >
        <table style="width: 95%; ">
            <thead>
            <th>item name</th>
            <th>item price</th>
            <th>item Quantity</th>
            <th>item code</th>
            </thead>
            <tbody>

            </tbody>
        </table>
        <button class="return-to-price-check" onclick="returnBack()">return to price check</button>
    </section>
    <script src="data-script.js"></script> 
    <script src="script.js"></script> 
</body>
</html>
